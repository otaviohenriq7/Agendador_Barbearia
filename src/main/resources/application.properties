spring.application.name=agendador

# Banco H2 em memoria: some quando a aplicacao para (bom pra fase de aprendizado)
spring.datasource.url=jdbc:h2:mem:agendador
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 para inspecionar o banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Recria as tabelas a cada start, a partir das entidades (@Entity)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Faz a API devolver a mensagem do erro no corpo da resposta.
# Sem isso o front recebe so "Conflict" e nao consegue mostrar o motivo real.
# Atencao: no Spring Boot 4 o nome mudou de "server.error.*" para "spring.web.error.*".
spring.web.error.include-message=always

# Inclui qual campo falhou na validacao (ex: "nome: O nome e obrigatorio")
spring.web.error.include-binding-errors=always
